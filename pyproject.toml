[project]
name = "gandalf-the-grader"
dynamic = ["version", "optional-dependencies"]
description = "Agent-as-judge grading framework for evaluating AI agent outputs against rubric criteria"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Handshake" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jinja2>=3.1,<4",
    "openhands-sdk>=1.11.2,<2",
    "openhands-tools>=1.11.2,<2",
    "pydantic>=2.12.5,<3",
]

[project.urls]
homepage = "https://github.com/Handshake-AI-Research/gandalf-the-grader"
repository = "https://github.com/Handshake-AI-Research/gandalf-the-grader"
issues = "https://github.com/Handshake-AI-Research/gandalf-the-grader/issues"

[project.scripts]
gandalf-the-grader = "gandalf.orchestrator:main"
gandalf-the-grader-judge = "gandalf.judge:main"

[build-system]
requires = ["hatchling", "hatch-pinned-extra>=0.2.0,<0.3.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/gandalf/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gandalf"]

[tool.hatch.envs.default]
installer = "uv"

[tool.hatch.metadata.hooks.pinned_extra]
name = "pinned"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.15.0", "mypy>=1.19.0"]

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.12", "3.13", "3.14"]

[tool.hatch.envs.types]
extra-dependencies = [
    "mypy>=1.19.0",
    "pytest>=8.0",
]

[tool.hatch.envs.types.scripts]
check = "mypy {args:src tests}"

[tool.hatch.envs.coverage]
detached = true
installer = "uv"
dependencies = [
    "coverage[toml]",
]

[tool.hatch.envs.coverage.scripts]
html = "coverage html"
xml = "coverage xml"

[tool.coverage.run]
omit = [
    "*/tests/*",
]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["openhands.sdk", "openhands.tools.*", "litellm"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = ["llm: end-to-end tests that call a real LLM (require LLM_API_KEY)"]
addopts = "-m 'not llm'"
